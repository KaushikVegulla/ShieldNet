# ShieldNet custom rules — evaluated BEFORE the OWASP CRS.
# Mounted into the ModSecurity container at /etc/modsecurity.d/ (see docker-compose.yml).

# Let internal health checks through without CRS scoring.
SecRule REQUEST_URI "@eq /healthz" \
    "id:900001,phase:1,pass,nolog,ctl:auditEngine=Off"

# Tag every request so audit-log entries are easy to filter for ShieldNet.
SecRule REQUEST_URI "@beginsWith /" \
    "id:900002,phase:1,pass,nolog,setvar:tx.shieldnet=1"
