# ShieldNet custom rules — evaluated AFTER the OWASP CRS.
# Mounted into the ModSecurity container at /etc/modsecurity.d/ (see docker-compose.yml).

# Demo/test hook: an explicit simulation header is always blocked, so the
# end-to-end attack tests (Phase 6) have a deterministic WAF-only case:
#   curl -H "X-Attack-Simulation: sqli" http://localhost:8080/search
SecRule REQUEST_HEADERS:X-Attack-Simulation "@rx (?i)(sqli|xss|traversal|rce)" \
    "id:949001,phase:2,deny,status:403,log,\
msg:'ShieldNet custom rule: simulated attack header',\
tag:'shieldnet/custom',severity:'CRITICAL'"

# Extra logging for the login endpoint — credential-stuffing visibility for
# the dashboard. Does not block by itself; CRS + the hybrid engine decide.
SecRule REQUEST_URI "@eq /login" \
    "id:949002,phase:2,pass,log,\
msg:'ShieldNet: login endpoint hit',tag:'shieldnet/auth'"
