# ShieldNet — PostgreSQL + ModSecurity WAF in front of a demo app + FastAPI backend.
# Dashboard runs on Vercel (Phase 5) and calls the backend API.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shieldnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env}
      POSTGRES_DB: ${POSTGRES_DB:-shieldnet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shieldnet}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shieldnet}:${POSTGRES_PASSWORD:-change-me-in-env}@db:5432/${POSTGRES_DB:-shieldnet}
      RISK_MONITOR_THRESHOLD: ${RISK_MONITOR_THRESHOLD:-40}
      RISK_BLOCK_THRESHOLD: ${RISK_BLOCK_THRESHOLD:-75}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  target-app:
    # Stand-in demo app for Phase 0/2. Replaced by target-app/ build in Phase 2.
    image: nginx:alpine
    expose:
      - "80"

  waf:
    image: owasp/modsecurity-crs:nginx
    environment:
      PROXY: "1"
      BACKEND: http://target-app:80
      MODSEC_AUDIT_LOG: /var/log/modsec_audit.log
    ports:
      - "${WAF_PORT:-8080}:8080"
    depends_on:
      - target-app

volumes:
  postgres-data:
