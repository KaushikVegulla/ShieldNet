# ShieldNet — PostgreSQL + FastAPI backend + ModSecurity WAF in front of the demo target app.
# Dashboard runs on Vercel (Phase 5) and calls the backend API.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shieldnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env}
      POSTGRES_DB: ${POSTGRES_DB:-shieldnet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shieldnet}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shieldnet}:${POSTGRES_PASSWORD:-change-me-in-env}@db:5432/${POSTGRES_DB:-shieldnet}
      RISK_MONITOR_THRESHOLD: ${RISK_MONITOR_THRESHOLD:-40}
      RISK_BLOCK_THRESHOLD: ${RISK_BLOCK_THRESHOLD:-75}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  target-app:
    build: ./target-app
    expose:
      - "5000"

  waf:
    image: owasp/modsecurity-crs:nginx
    environment:
      PROXY: "1"
      BACKEND: http://target-app:5000
      # OWASP CRS tuning — start at paranoia 1, blocking mode
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      # JSON audit log — shipped to the backend by backend/scripts/parse_audit_log.py
      MODSEC_AUDIT_LOG: /var/log/modsec_audit.log
      MODSEC_AUDIT_LOG_FORMAT: JSON
    ports:
      - "${WAF_PORT:-8080}:8080"
    volumes:
      - ./waf/rules/REQUEST-900-SHIELDNET-BEFORE-CRS.conf:/etc/modsecurity.d/REQUEST-900-SHIELDNET-BEFORE-CRS.conf:ro
      - ./waf/rules/REQUEST-949-SHIELDNET-AFTER-CRS.conf:/etc/modsecurity.d/REQUEST-949-SHIELDNET-AFTER-CRS.conf:ro
      - modsec-logs:/var/log
    depends_on:
      - target-app

volumes:
  postgres-data:
  modsec-logs:
