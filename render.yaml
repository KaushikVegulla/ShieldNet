# Render Blueprint — ShieldNet backend + PostgreSQL.
# Render dashboard -> New -> Blueprint -> connect this repo -> Apply.
# Creates a free web service (Docker, from backend/Dockerfile) wired to a
# free PostgreSQL database via DATABASE_URL. See docs/HOSTING.md.
services:
  - type: web
    name: shieldnet-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # DATABASE_URL points at the Neon PostgreSQL project (free tier, no
      # expiry) since 12 Nov 2026 — Render's free database expires after 30
      # days. sync: false = the value is set by hand in the dashboard and
      # blueprint applies must not overwrite it. The shieldnet-db resource
      # below is the retired Render database (expires 11 Dec 2026); it is
      # kept in the file only so a sync does not try to recreate wiring.
      - key: DATABASE_URL
        sync: false
      - key: RISK_MONITOR_THRESHOLD
        value: "40"
      - key: RISK_BLOCK_THRESHOLD
        value: "75"
      # Auth: JWT signing secret + refresh-cookie flags for the cross-site
      # setup (Vercel frontend -> Render backend). generateValue makes Render
      # create a random value on first blueprint apply; for an existing
      # service, add these in the dashboard's Environment tab instead.
      - key: JWT_SECRET
        generateValue: true
      - key: INGEST_API_KEY
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: "none"
      - key: CORS_ORIGINS
        value: "https://shieldnet-web.vercel.app,http://localhost:5173"

databases:
  - name: shieldnet-db
    databaseName: shieldnet
    user: shieldnet
    plan: free
